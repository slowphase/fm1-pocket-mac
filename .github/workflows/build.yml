# Builds FM-1 Pocket for macOS on GitHub's Apple Silicon Mac, tests it, signs it ad hoc and packs a zip.
#
#   Every push to main and every pull request: build, test, upload the zip as a downloadable artifact.
#   A version tag (v0.9.0) or "Run workflow" with "Publish a release" ticked: also a normal (not pre-release) GitHub
#   Release with the zip, marked as the latest release. Release builds leave out Resources/emu-preview.json.
#
# Nothing to install on your own Mac: everything runs here.
name: Build Mac app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish this build as a GitHub Release"
        type: boolean
        default: false
      version:
        description: "Version number for the release (e.g. 0.9.0)"
        type: string
        default: ""
      preflight:
        description: "Build exactly as a release would (no emu-preview.json) and run the release preflight, without publishing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15          # Apple Silicon (arm64)
    timeout-minutes: 40
    permissions:
      contents: write          # only used by the release step
    steps:
      - uses: actions/checkout@v7

      - name: Show the tools
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${{ inputs.version }}" ]; then V="${{ inputs.version }}"
          else V="0.9.1"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version $V, build ${{ github.run_number }}"

      - name: Build upstream fm1-emu's engine (universal static library)
        run: scripts/build-emu.sh

      - name: Is the emulator pin one that passed Pocket's upgrade check?
        # Emu/Cargo.toml pins fm1-emu for this app, independently of FM-1 Pocket Player's pin; a pin should only move to
        # a commit listed in fm1-pocket-player's pocket/emu/verified.json (upgrade check + listening test). A warning, not a failure.
        run: |
          pin=$(sed -n 's/.*fm1-emu.*rev *= *"\([0-9a-f]*\)".*/\1/p' Emu/Cargo.toml | head -1)
          for ref in main emu-eval; do
            if curl -fsSL "https://raw.githubusercontent.com/slowphase/fm1-pocket-player/$ref/pocket/emu/verified.json" -o verified.json; then break; fi
          done
          if [ ! -s verified.json ]; then echo "::warning::Could not read Pocket's verified.json"; exit 0; fi
          if python3 -c "import json,sys;sys.exit(0 if any(c['commit'].startswith('$pin') for c in json.load(open('verified.json'))['commits']) else 1)"; then
            echo "fm1-emu pin $pin is in Pocket's verified list" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::fm1-emu pin $pin is not in Pocket's verified list: run Pocket's emulator upgrade check first" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Original packages for the emulator self-test (makers' releases, SHA-256 checked)
        run: |
          mkdir -p build/packages
          python3 - <<'PY'
          import json, hashlib, urllib.request
          for p in json.load(open("Tests/emu-packages.json"))["packages"]:
              b = urllib.request.urlopen(urllib.request.Request(p["url"], headers={"User-Agent": "FM-1 Pocket for macOS CI"})).read()
              ok = hashlib.sha256(b).hexdigest() == p["sha256"]
              print(p["hub"], len(b), "ok" if ok else "SHA-256 MISMATCH")
              if ok: open(f"build/packages/{p['hub']}.fwsc", "wb").write(b)
          PY

      - name: Test the native firmware host (C, h1)
        run: make -C Tests/ctest test | tee host-test.log

      - name: Show how wasm3 is compiled (debug)
        run: |
          swift build --target CWasm3 -v 2>&1 | grep -m1 "m3_exec.c" | tr ' ' '\n' | grep -E '^-(O|g|f|D|U)' | sort -u | tr '\n' ' '; echo

      - name: Run the Swift tests
        run: |
          set -o pipefail
          FM1_FWSC="$PWD/build/packages/felucca.fwsc" FM1_FWSC_DIR="$PWD/build/packages" swift test 2>&1 | tee swift-test.log

      - name: Check the live Pocket catalogue (does not block the build)
        id: live
        continue-on-error: true
        run: |
          set -o pipefail
          FM1_LIVE=1 swift test --filter CatalogueTests/testLiveCatalogue 2>&1 | tee live-test.log

      - name: Build the app
        env:
          VERSION: ${{ steps.v.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          # a release reads the published catalogue only, without the test builds' stand-in emulator data
          NO_PREVIEW: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.release || inputs.preflight) && '1' || '' }}
        run: scripts/build-app.sh

      - name: Self-test the packaged app (boots h1 inside the .app)
        run: '"build/FM-1 Pocket.app/Contents/MacOS/FM1Pocket" --selftest build/selftest.json'

      - name: Emulator engine self-test in the packaged app (engine boot checks, nobody listens)
        run: |
          echo "## Emulator engine (fm1-emu) on $(sysctl -n machdep.cpu.brand_string)" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | OK | Speed | Keys | MIDI | PLAY | Save round trip |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "=====RESULTS-BEGIN====="
          echo "["
          first=1
          for f in build/packages/*.fwsc; do
            id=$(basename "$f" .fwsc)
            # (a stuck package must not hold the build: two minutes each at most)
            perl -e 'alarm 120; exec @ARGV' "build/FM-1 Pocket.app/Contents/MacOS/FM1Pocket" --selftest-fwsc "$f" "build/emu-$id.json" > /dev/null || true
            [ -f "build/emu-$id.json" ] || echo '{"ok": false, "error": "no answer within 120 s"}' > "build/emu-$id.json"
            [ $first = 1 ] || echo ","; first=0
            python3 -c "import json,sys; r=json.load(open('build/emu-$id.json')); r['id']='$id'; print(json.dumps(r))"
            python3 -c "import json; r=json.load(open('build/emu-$id.json')); f=lambda k: '%.3f'%r.get(k,0); print(f\"| $id | {r['ok']} | {r.get('speedXRealtime',0):.2f}x | {f('keysRms')} | {f('midiRms')} | {f('playRms')} | {r.get('saveRoundTrip')} |\")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "]"
          echo "=====RESULTS-END====="

      - name: .rfm1 builds for the integration test (FM-1 Pocket Player's published catalogue, SHA-256 checked)
        run: |
          mkdir -p build/rfm1
          python3 - <<'PY'
          import json, hashlib, urllib.request
          base = "https://slowphase.github.io/fm1-pocket-player/data/"
          ua = {"User-Agent": "FM-1 Pocket for macOS CI"}
          cat = json.load(urllib.request.urlopen(urllib.request.Request(base + "catalog.json", headers=ua)))
          for f in cat["firmwares"]:
              if f["id"] not in ("felucca", "hortator", "amb"): continue
              b = urllib.request.urlopen(urllib.request.Request(base + f["file"], headers=ua)).read()
              ok = hashlib.sha256(b).hexdigest() == f["sha256"]
              print(f["id"], f["version"], len(b), "ok" if ok else "SHA-256 MISMATCH")
              if ok: open(f"build/rfm1/{f['id']}.rfm1", "wb").write(b)
          PY

      - name: App-level integration test (the app's controls, audio graph and saves; automated, nobody listens)
        run: |
          set +e
          perl -e 'alarm 1500; exec @ARGV' "build/FM-1 Pocket.app/Contents/MacOS/FM1Pocket" --integration Tests/integration/scenarios.json build/integration.json > /dev/null
          code=$?
          echo "=====RESULTS-BEGIN====="; cat build/integration.json; echo "=====RESULTS-END====="
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("build/integration.json"))
          print("## App-level integration test (automated; nobody listened)\n")
          print("| Firmware | Engine | Kind | OK | Sound (RMS) | Save | Failures |")
          print("| --- | --- | --- | --- | --- | --- | --- |")
          for r in d.get("firmwares", []):
              rms = ", ".join(f"{k} {v:.3f}" for k, v in sorted((r.get("rms") or {}).items()))
              sv = r.get("save")
              save = "" if sv is None else ("restored" if sv.get("sameFlashAfterRelaunch") else "NOT restored")
              print(f"| {r.get('id')} | {r.get('engine','')} | {r.get('kind','')} | {r.get('ok')} | {rms} | {save} | {'; '.join(r.get('failures', []))} |")
          PY
          exit $code

      - name: The expanded catalogue in the real app (FM1 Editor listings, credits, favourites and two promotions)
        # the packaged app on this Mac reads Tests/Fixtures' expanded catalogue (from FM-1 Pocket Player's pipeline) instead
        # of the site: night 1 has FM1 Editor's 159 listings; on night 2 the Hub and RemoteFM1FW have taken up KickSide and
        # GLITCH. It saves its own windows as pictures and what each selected firmware showed; the checks below read those.
        run: |
          set -o pipefail
          APP="build/FM-1 Pocket.app/Contents/MacOS/FM1Pocket"
          mkdir -p build/ui-cat-night1 build/ui-cat-night2 build/ui-library
          cp Tests/Fixtures/expanded-v2-night1.json build/ui-cat-night1/catalog-v2.json
          cp Tests/Fixtures/expanded-v2-night2.json build/ui-cat-night2/catalog-v2.json
          cp Tests/Fixtures/expanded-v1-night2.json build/ui-cat-night2/catalog.json
          export FM1_UI_LIBRARY="$PWD/build/ui-library"
          perl -e 'alarm 240; exec @ARGV' "$APP" --ui-snapshot "$PWD/build/ui-cat-night1" "$PWD/build/ui/night1" \
            more:more:kickside more:more:midi-processor more:more:shrub favourite:more:kickside about || true
          perl -e 'alarm 240; exec @ARGV' "$APP" --ui-snapshot "$PWD/build/ui-cat-night2" "$PWD/build/ui/night2" \
            all:cat:kickside all:cat:glitch-ttreu all:cat:glitch favourites || true
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          n1 = json.load(open("build/ui/night1/ui-snapshot.json")); n2 = json.load(open("build/ui/night2/ui-snapshot.json"))
          s1 = {s["shot"]: s for s in n1["shots"]}; s2 = {s["shot"]: s for s in n2["shots"]}
          bad = []
          def check(ok, what): (None if ok else bad.append(what))
          print("## The expanded catalogue in the real app\n")
          print(f"Night 1: {n1['items']} in the library, {n1['more']} under More Firmware. Night 2: {n2['items']} and {n2['more']}.\n")
          print("| Shot | Firmware | Section | Plays | Description credit | Licence | Listed by FM1 Editor | Hub credit | Favourite | Picture |")
          print("| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |")
          for night in (n1, n2):
              for s in night["shots"]:
                  it = s.get("item", {})
                  print(f"| {s['shot']} | {it.get('name','')} | {s.get('section','')} | {it.get('canPlay','')} | {it.get('descriptionCredit','')} | "
                        f"{it.get('descriptionLicence','')} | {'yes' if it.get('editorURL') else ''} | {'yes' if it.get('hubURL') else ''} | {it.get('favourite','')} | {s.get('saved')} |")
          for s in n1["shots"] + n2["shots"]: check(s.get("saved") is True, f"{s['shot']}: no picture")
          for k in ("more:more:kickside", "more:more:midi-processor", "more:more:shrub"):
              it = s1[k]["item"]
              check(it["listedOnly"] and not it["canPlay"], f"{k}: should be a listing")
              check(it["description"] and it["about"] == "", f"{k}: the Editor's description, outside about")
              check(it["descriptionCredit"] == "Description from FM1 Editor" and it["descriptionLicence"] == "MIT", f"{k}: description without its credit")
              check(it["editorURL"] and not it["hubURL"], f"{k}: Editor credit, never the Hub's")
          check(s1["more:more:midi-processor"]["item"]["category"] == "Other", "a tool is under Other")
          check(s1["more:more:shrub"]["item"]["sourceURL"] == "https://shrub.audio/editor/install", "SHRUB links to its install page")
          check("more:kickside" in s1["favourite:more:kickside"].get("favourites", []), "a listing can be a favourite")
          k = s2["all:cat:kickside"]["item"]; g = s2["all:cat:glitch-ttreu"]["item"]; gr = s2["all:cat:glitch"]["item"]
          check(k["canPlay"] and k["engine"] == "fm1-emu", "KickSide plays its original package")
          check(k["hubURL"] and k["editorURL"] and k["descriptionCredit"], "KickSide: Hub credit, Editor credit, credited description")
          check(g["canPlay"] and g["engine"] == "rfm1" and g["name"] == "GLITCH", "GLITCH plays its .rfm1 build under glitch-ttreu")
          check(gr["name"] == "GR!MM" and not gr["editorURL"], "Pocket's glitch is GR!MM, untouched")
          check(k["favourite"], "the favourite made on night 1, while KickSide was a listing, is still a favourite on night 2")
          check(s2["favourites"]["item"]["id"] == "cat:kickside", "Favourites shows KickSide, now playable")
          print("\n" + ("All checks passed." if not bad else "**Failed:** " + "; ".join(bad)))
          sys.exit(1 if bad else 0)
          PY

      - name: Pictures of the expanded catalogue in the app (also in the log, small)
        if: always()
        run: |
          mkdir -p build/ui-small
          for f in build/ui/*/*.png; do
            [ -f "$f" ] || continue
            n="$(basename "$(dirname "$f")")-$(basename "$f" .png)"
            sips -Z 1400 -s format jpeg -s formatOptions 62 "$f" --out "build/ui-small/$n.jpg" > /dev/null
            echo "=====IMAGE-BEGIN $n====="; base64 -i "build/ui-small/$n.jpg" | tr -d '\n'; echo; echo "=====IMAGE-END====="
          done

      - name: Keep the app's pictures of the expanded catalogue
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expanded-catalogue-in-the-app
          path: |
            build/ui/
          if-no-files-found: ignore
          retention-days: 30

      - name: Release preflight on the expanded catalogue (the library code with FM1 Editor's listings and promotions)
        run: |
          set -o pipefail
          rm -rf build/preflight-expanded && mkdir -p build/preflight-expanded
          FM1_PREFLIGHT="$PWD/build/preflight-expanded" FM1_PREFLIGHT_BASE="$PWD/build/ui-cat-night2" swift test --filter PreflightTests 2>&1 | tail -6
          python3 -c "
          import json; p = json.load(open('build/preflight-expanded/preflight.json'))
          print(f\"Expanded catalogue: {p['entries']} library entries, {p['packages']} original packages, {p['preferEmulator']} preferring the emulator, {p['packagesDownloaded']} downloaded, {p['failedDownloads']} failed\")" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Release preflight (the live catalogue, no emu-preview.json; a failure stops the release)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release || inputs.preflight
        run: |
          set -o pipefail
          APP="build/FM-1 Pocket.app"
          test ! -e "$APP/Contents/Resources/emu-preview.json" || { echo "emu-preview.json is inside the app"; exit 1; }
          rm -rf build/preflight && mkdir -p build/preflight
          # the app's library code, as the release runs it: live catalog-v2.json, original packages downloaded, SHA-256 checked
          FM1_PREFLIGHT="$PWD/build/preflight" swift test --filter PreflightTests 2>&1 | tail -15
          cat build/preflight/preflight.json
          # the packaged release app plays five of the packages the library downloaded (keys, MIDI, PLAY, a save)
          python3 - "$APP/Contents/MacOS/FM1Pocket" <<'PY'
          import json, os, subprocess, sys
          app = sys.argv[1]
          p = json.load(open("build/preflight/preflight.json"))
          rows, ok = [], True
          for f in p["play"]:
              out = "build/preflight/" + f["id"] + ".json"
              subprocess.run(["perl", "-e", "alarm 120; exec @ARGV", app, "--selftest-fwsc", f["file"], out], capture_output=True)
              r = json.load(open(out)) if os.path.exists(out) else {"ok": False}
              ok = ok and r.get("ok") is True
              rows.append(f"| {f['name']} | {r.get('ok')} | {r.get('keysRms', 0):.3f} | {r.get('playRms', 0):.3f} | {r.get('saveRoundTrip')} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("## Release preflight (no emu-preview.json, live catalogue)\n\n")
              s.write(f"Feed {p['feed']}: {p['packages']} original packages, {p['preferEmulator']} preferring the emulator, "
                      f"{p['packagesDownloaded']} downloaded and checked ({p['failedDownloads']} failed downloads).\n\n")
              s.write("| Played in the release app | OK | Keys | PLAY | Save |\n| --- | --- | --- | --- | --- |\n" + "\n".join(rows) + "\n")
          print("\n".join(rows))
          sys.exit(0 if ok else 1)
          PY

      - name: Make the zip
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: scripts/make-zip.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "## FM-1 Pocket ${{ steps.v.outputs.version }} (build ${{ github.run_number }})"
            echo
            echo "**Download:** scroll to *Artifacts* at the bottom of this page and click the FM1-Pocket entry. Double-click the downloaded .zip to get the app."
            echo
            echo "### Native host (C, h1)"
            echo '```'; grep -E "^(loaded|ok|FAIL)" host-test.log 2>/dev/null || echo "(not run)"; echo '```'
            echo "### Swift tests"
            echo '```'; grep -E "Executed|h1 speed|error:|failed" swift-test.log 2>/dev/null | tail -15 || echo "(not run)"; echo '```'
            echo "### Live catalogue (outcome: ${{ steps.live.outcome }})"
            echo '```'; grep -E "live (catalogue|firmware)|Executed|error" live-test.log 2>/dev/null | tail -6 || echo "(not run)"; echo '```'
            echo "### Packaged app self-test"
            echo '```json'; cat build/selftest.json 2>/dev/null || echo "(not run)"; echo; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the zip
        uses: actions/upload-artifact@v7
        with:
          # uploaded as it is (one zip to download, not a zip inside GitHub's own zip)
          archive: false
          path: build/FM1-Pocket-${{ steps.v.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.v.outputs.version }}
        run: |
          NOTES="FM-1 Pocket $V for Apple silicon Macs (macOS 14 Sonoma or later). Not notarised by Apple: see https://github.com/${{ github.repository }}/blob/main/docs/If%20the%20app%20will%20not%20open.txt"
          # a normal release (no --prerelease), marked as the latest so /releases/latest points to it
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" build/*.zip --clobber
          else
            # docs/release-notes/<version>.md when there is one, else the short note above
            if [ -f "docs/release-notes/$V.md" ]; then set -- --notes-file "docs/release-notes/$V.md"; else set -- --notes "$NOTES"; fi
            gh release create "v$V" build/*.zip --title "FM-1 Pocket $V" "$@" --target "$GITHUB_SHA" --latest
          fi
